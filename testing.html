    <script src="src/w3c-webvtt.js"></script>
    <script>
        async function openVTTFile(url) {
            const payload = await fetch(url).then((r) => r.text());
            // console.log(payload);
            const parser = new WebVTTParser();
            const tree = parser.parse(payload, "metadata");
            console.log(tree.cues.map(({ tree }) => tree.children[0].value));
        }
        openVTTFile("./examples/parser.vtt");
    </script>
